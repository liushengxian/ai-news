<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 新闻简报 · 每日 AI 科技新闻</title>
<meta name="description" content="由 DimAgent 自动生成的每日 AI 科技新闻简报：模型发布 / 前沿研究 / 融资动态 / 政策监管。">
<meta name="theme-color" content="#fbf6ee">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AI 新闻简报">
<meta property="og:title" content="AI 新闻简报 · 每日 AI 科技新闻">
<meta property="og:description" content="每日 AI 科技新闻汇总：模型发布 / 前沿研究 / 融资动态 / 政策监管。">

<meta name="twitter:title" content="AI 新闻简报 · 每日 AI 科技新闻">
<meta name="twitter:description" content="每日 AI 科技新闻汇总：模型发布 / 前沿研究 / 融资动态 / 政策监管。">
<link rel="canonical" href="https://liushengxian.github.io/ai-news/">
<link rel="alternate" type="application/rss+xml" title="AI 新闻简报" href="rss.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<script>
(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
  :root{
    /* Warm Editorial（Open Design） */
    --bg:#fbf6ee;
    --surface:#fffdf8;
    --surface-warm:#f1e3cf;
    --text:#201914;
    --muted:#7a6d63;
    --faint:#a89a8b;
    --border:#ded2c3;
    --border-soft:#eee4d7;
    --accent:#9b5b32;
    --accent-on:#ffffff;
    --accent2:#2f5b4f;
    --success:#4f8a4f;
    --warn:#c9822f;
    --danger:#b33a3a;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    --radius-sm:10px;--radius-md:16px;--radius-lg:24px;--radius-pill:9999px;
    --elev-raised:0 20px 52px rgba(32,25,20,.10);
    --focus-ring:0 0 0 4px rgba(155,91,50,.22);
    --motion-fast:150ms;--motion-base:240ms;
    --ease-standard:cubic-bezier(.2,0,0,1);
  }
  :root[data-theme="dark"]{
    --bg:#16120e;
    --surface:#1e1914;
    --surface-warm:#2a231c;
    --text:#f2eae0;
    --muted:#a89a8b;
    --faint:#7d7165;
    --border:#3a3229;
    --border-soft:#2c261f;
    --accent:#cf8a5c;
    --accent-on:#201914;
    --accent2:#6f9d8f;
    --success:#5f9a5f;
    --warn:#d99a4a;
    --danger:#c96a5e;
    --elev-raised:0 20px 52px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(155,91,50,.22)}
  .container{max-width:860px;margin:0 auto;padding:0 20px}

  /* ---------- Header（与日报页一致） ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in oklab,var(--bg) 88%,transparent);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border-soft);
  }
  .head-inner{padding:22px 20px 14px}
  .kicker{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:11px;letter-spacing:.28em;color:var(--muted);
    text-transform:uppercase;font-weight:600;margin-bottom:8px;
  }
  .kicker-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .kicker .powered{
    font-size:10px;letter-spacing:.08em;color:var(--faint);opacity:.85;
    text-transform:none;font-family:var(--font-mono);
  }
  .kicker a{
    color:var(--muted);text-decoration:none;letter-spacing:.06em;
    transition:color var(--motion-fast) var(--ease-standard);
  }
  .kicker a:hover{color:var(--accent)}
  .kicker a.gh{display:inline-flex;align-items:center}
  .kicker a.gh svg{width:14px;height:14px}
  footer a.gh{display:inline-flex;align-items:center;vertical-align:middle}
  footer a.gh svg{width:13px;height:13px}
  @media (max-width:560px){.kicker .powered{display:none}}
  h1{
    font-family:var(--font-display);
    font-size:clamp(32px,6vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.15;
    color:var(--text);
  }
  .sub{
    margin-top:10px;font-size:13.5px;color:var(--muted);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub .dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .sub #count{color:var(--accent);font-weight:700}

  /* ---------- 列表卡片 ---------- */
  main{padding:36px 0 12px}
  .list{display:flex;flex-direction:column;gap:14px}

  .item{
    --cc:var(--accent);
    position:relative;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:20px 24px;
    text-decoration:none;color:inherit;
    transition:transform var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard);
    opacity:0;transform:translateY(14px);
    animation:rise .55s cubic-bezier(.22,.8,.36,1) forwards;
    animation-delay:calc(var(--i)*80ms);
  }
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .item{opacity:1;transform:none;animation:none}
    html{scroll-behavior:auto}
  }
  .item:hover{
    transform:translateY(-2px);
    border-color:var(--cc);
    box-shadow:var(--elev-raised);
  }

  .item-info{min-width:0;display:flex;flex-direction:column;gap:9px}
  .item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);
    font-size:11px;font-weight:500;line-height:1;letter-spacing:.04em;
    padding:5px 10px;border-radius:var(--radius-pill);
  }
  .badge.date{color:var(--muted);background:transparent;border:1px solid var(--border)}
  .badge.count{
    color:var(--accent);background:var(--surface-warm);
    border:1px solid var(--border);
  }
  .badge.count::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}

  .item-title{
    font-size:17.5px;font-weight:600;line-height:1.5;letter-spacing:.005em;
    color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color var(--motion-fast) var(--ease-standard);
  }
  .item:hover .item-title{color:var(--accent)}

  .item-side{flex-shrink:0;display:flex;align-items:center;gap:14px}
  .latest{
    font-size:10.5px;font-weight:700;letter-spacing:.08em;
    color:var(--accent-on);
    background:var(--accent);
    padding:5px 11px;border-radius:var(--radius-pill);
  }
  .arrow{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border);
    color:var(--faint);font-size:15px;
    transition:all var(--motion-fast) var(--ease-standard);
  }
  .item:hover .arrow{
    color:var(--accent);border-color:var(--accent);
    background:transparent;
    transform:translateX(3px);
  }

  /* ---------- 空态 ---------- */
  .empty{
    text-align:center;color:var(--muted);padding:80px 0;
    border:1px dashed var(--border);border-radius:var(--radius-md);
  }

  /* ---------- Footer（与日报页一致） ---------- */
  footer.container{text-align:center;padding:40px 20px 56px;color:var(--faint);font-size:12.5px}
  footer .line{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:0 auto 14px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  footer b{color:var(--muted);font-weight:600}

  @media (max-width:560px){
    .container{padding:0 16px}
    .head-inner{padding:16px 16px 12px}
    .kicker{font-size:9.5px;letter-spacing:.16em}
    .kicker-right{gap:10px}
    h1{font-size:clamp(26px,7.5vw,34px)}
    .sub{font-size:12.5px}
    main{padding:22px 0 10px}
    .item{padding:16px 16px;gap:12px}
    .item-title{font-size:15px}
    .item-meta{gap:6px}
    .badge{padding:4px 8px;font-size:10px}
    .arrow{width:28px;height:28px;font-size:13px}
    footer.container{padding:28px 16px 40px}
  }
  @media (hover:none){
    .item:hover{transform:none}
  }

  /* ---------- 主题切换 / RSS ---------- */
  .theme-btn{
    appearance:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--muted);font-size:13px;line-height:1;padding:6px 8px;cursor:pointer;
    display:inline-flex;align-items:center;
    transition:all var(--motion-fast) var(--ease-standard);
  }
  .theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
  .kicker a.rss{letter-spacing:.06em}

  /* ---------- 全站搜索 ---------- */
  .searchbar{position:relative;margin-bottom:24px}
  .searchbar input{
    width:100%;padding:14px 18px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-size:14px;font-family:inherit;outline:none;
    transition:border-color var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard);
  }
  .searchbar input::placeholder{color:var(--faint)}
  .searchbar input:focus{border-color:var(--accent);box-shadow:var(--focus-ring)}
  .qcount{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:11.5px;color:var(--faint);white-space:nowrap;
    font-family:var(--font-mono);
  }
  .badge.cat{color:var(--cc);background:var(--surface-warm);border:1px solid var(--border)}
  .badge.cat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cc)}
  .badge.src{color:var(--muted);background:transparent;border:1px solid var(--border);font-size:10.5px;letter-spacing:.02em}
  .sresult .snippet{color:var(--muted);font-size:13px;line-height:1.75;margin-top:6px}
  .snippet mark{background:rgba(155,91,50,.16);color:inherit;border-radius:3px;padding:0 2px}
</style>
</head>
<body>

<header>
  <div class="container head-inner">
    <div class="kicker">
      <span>Tech · AI · Daily Briefing</span>
      <span class="kicker-right">
        <a class="rss" href="rss.xml" target="_blank" rel="noopener">RSS</a>
        <a class="powered" href="https://dimcode.dev/" target="_blank" rel="noopener">powered by DimAgent</a>
        <a class="gh" href="https://github.com/liushengxian/ai-news" target="_blank" rel="noopener" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
        <button id="themeBtn" class="theme-btn" aria-label="切换浅色/深色主题"><span class="ico">☀️</span></button>
        <a href="about.html">关于 ↗</a>
      </span>
    </div>
    <h1>AI 新闻简报</h1>
    <p class="sub">
      <span>每日 AI 科技新闻汇总</span>
      <span class="dot"></span>
      <span>共 <b id="count">–</b> 期</span>
    </p>
  </div>
</header>

<main>
  <div class="container">
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜索全部日报的标题与摘要…" autocomplete="off" aria-label="搜索">
      <span class="qcount" id="qcount"></span>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none">暂无简报，等待第一份日报发布…</div>
  </div>
</main>

<footer class="container">
  <div class="line"></div>
  <span>由 <a href="https://dimcode.dev/" target="_blank" rel="noopener">Dim Agent</a> 自动生成 · <a class="gh" href="https://github.com/liushengxian/ai-news" target="_blank" rel="noopener" aria-label="GitHub 仓库"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a></span>
</footer>

<script>
  var CATS = {
    model:    { label: '模型发布', cc: '#9b5b32' },
    research: { label: '前沿研究', cc: '#2f5b4f' },
    business: { label: '融资动态', cc: '#4f8a4f' },
    policy:   { label: '政策监管', cc: '#c9822f' }
  };
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var qcount = document.getElementById('qcount');
  var lastReports = [];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, function (c) { return '\\' + c; }); }

  function renderReports(reports) {
    document.getElementById('count').textContent = reports.length;
    if (!reports.length) {
      list.innerHTML = '';
      empty.style.display = '';
      return;
    }
    var html = reports.map(function (r, i) {
      var latest = i === 0 ? '<span class="latest">最新</span>' : '';
      var meta = r.count != null ? r.count + ' 条新闻' : '已发布';
      var title = r.title || ('AI 科技日报 · ' + r.date);
      return (
        '<a class="item" style="--i:' + (i + 1) + '" href="report.html?date=' + encodeURIComponent(r.date) + '">' +
          '<div class="item-info">' +
            '<div class="item-meta">' +
              '<span class="badge date">' + r.date + '</span>' +
              '<span class="badge count">' + meta + '</span>' +
            '</div>' +
            '<h2 class="item-title">' + esc(title) + '</h2>' +
          '</div>' +
          '<div class="item-side">' +
            latest +
            '<span class="arrow">→</span>' +
          '</div>' +
        '</a>'
      );
    }).join('');
    list.innerHTML = html;
    empty.style.display = 'none';
  }

  // ---------- 全站搜索 ----------
  var idxCache = null;
  function getIndex() {
    if (idxCache) return Promise.resolve(idxCache);
    return fetch('search-index.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { idxCache = d.items || []; return idxCache; });
  }
  function highlight(text, terms) {
    var t = esc(text);
    terms.forEach(function (term) {
      t = t.replace(new RegExp(escapeReg(term), 'gi'), function (m) {
        return '<mark>' + m + '</mark>';
      });
    });
    return t;
  }
  var searchTimer = null;
  document.getElementById('q').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 200);
  });
  function runSearch() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    qcount.textContent = '';
    if (!q) { renderReports(lastReports); return; }
    getIndex().then(function (items) {
      var terms = q.split(/\s+/).filter(Boolean);
      var hits = items.filter(function (it) {
        var hay = ((it.t || '') + ' ' + (it.s || '') + ' ' + (it.src || '')).toLowerCase();
        return terms.every(function (t) { return hay.indexOf(t) !== -1; });
      });
      if (!hits.length) {
        list.innerHTML = '';
        qcount.textContent = '无结果';
        return;
      }
      qcount.textContent = hits.length + ' 条结果';
      list.innerHTML = hits.slice(0, 50).map(function (it, i) {
        var cat = CATS[it.c] || CATS.model;
        return (
          '<a class="item sresult" style="--i:' + (i + 1) + '" href="report.html?date=' + encodeURIComponent(it.d) + '">' +
            '<div class="item-info">' +
              '<div class="item-meta">' +
                '<span class="badge date">' + it.d + '</span>' +
                '<span class="badge cat" style="--cc:' + cat.cc + '">' + cat.label + '</span>' +
                (it.src ? '<span class="badge src">' + esc(it.src) + '</span>' : '') +
              '</div>' +
              '<h2 class="item-title">' + highlight(it.t, terms) + '</h2>' +
              '<p class="snippet">' + highlight(it.s, terms) + '</p>' +
            '</div>' +
            '<div class="item-side"><span class="arrow">→</span></div>' +
          '</a>'
        );
      }).join('');
    }).catch(function () {
      qcount.textContent = '搜索索引加载失败';
    });
  }

  // ---------- 首页期数列表 ----------
  fetch('reports.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      lastReports = data.reports || [];
      renderReports(lastReports);
    })
    .catch(function (err) {
      empty.style.display = '';
      empty.textContent = '加载失败：' + err.message;
    });

  // ---------- 主题切换 ----------
  (function () {
    var btn = document.getElementById('themeBtn');
    function cur() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
    function sync() {
      var ico = btn && btn.querySelector('.ico');
      if (ico) ico.textContent = cur() === 'light' ? '🌙' : '☀️';
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', cur() === 'light' ? '#fbf6ee' : '#16120e');
    }
    if (btn) btn.addEventListener('click', function () {
      var t = cur() === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('theme', t); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
</body>
</html>
