<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 新闻简报 · 首页</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a12;
    --text:#e7ecf5;
    --muted:#8b94a9;
    --faint:#5c6579;
    --border:rgba(148,163,184,.14);
    --accent:#6ea8ff;
    --accent2:#b388ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 560px at 82% -12%, rgba(120,90,255,.16), transparent 60%),
      radial-gradient(900px 520px at -12% 8%, rgba(45,140,255,.13), transparent 60%),
      radial-gradient(700px 700px at 50% 120%, rgba(34,211,238,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(110,168,255,.35)}
  .container{max-width:860px;margin:0 auto;padding:0 20px}

  /* ---------- Header（与日报页一致） ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(7,10,18,.78);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .head-inner{padding:22px 0 14px}
  .kicker{
    font-size:11px;letter-spacing:.32em;color:var(--faint);
    text-transform:uppercase;font-weight:600;margin-bottom:8px;
  }
  h1{
    font-size:clamp(30px,6vw,44px);font-weight:900;letter-spacing:.01em;line-height:1.15;
    background:linear-gradient(92deg,#ffffff 10%,#b9c8ff 55%,var(--accent2) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:inline-block;
  }
  .sub{
    margin-top:8px;font-size:13.5px;color:var(--muted);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub .dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .sub #count{color:#9cc0ff;font-weight:600}

  /* ---------- 列表卡片 ---------- */
  main{padding:34px 0 12px}
  .list{display:flex;flex-direction:column;gap:16px}

  .item{
    --cc:var(--accent);
    position:relative;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.014));
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 24px;
    text-decoration:none;color:inherit;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease;
    opacity:0;transform:translateY(14px);
    animation:rise .55s cubic-bezier(.22,.8,.36,1) forwards;
    animation-delay:calc(var(--i)*80ms);
  }
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .item{opacity:1;transform:none;animation:none}
    html{scroll-behavior:auto}
  }
  .item:hover{
    transform:translateY(-3px);
    border-color:var(--cc);
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    box-shadow:0 16px 40px rgba(2,6,16,.55),0 0 0 1px rgba(255,255,255,.02) inset, 0 0 24px -6px color-mix(in srgb,var(--cc) 45%,transparent);
  }

  .item-info{min-width:0;display:flex;flex-direction:column;gap:9px}
  .item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono','Noto Sans SC',monospace;
    font-size:11px;font-weight:500;line-height:1;letter-spacing:.04em;
    padding:5px 10px;border-radius:999px;
  }
  .badge.date{color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border)}
  .badge.count{
    color:var(--accent);background:rgba(255,255,255,.045);
    border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  }
  .badge.count::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}

  .item-title{
    font-size:17.5px;font-weight:700;line-height:1.5;letter-spacing:.005em;
    color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .18s ease;
  }
  .item:hover .item-title{color:#bcd2ff}

  .item-side{flex-shrink:0;display:flex;align-items:center;gap:14px}
  .latest{
    font-size:10.5px;font-weight:700;letter-spacing:.08em;
    color:#070a12;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    padding:5px 11px;border-radius:999px;
    box-shadow:0 4px 14px rgba(110,140,255,.3);
  }
  .arrow{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border);
    color:var(--faint);font-size:15px;
    transition:all .22s ease;
  }
  .item:hover .arrow{
    color:#fff;border-color:rgba(110,168,255,.5);
    background:rgba(110,168,255,.1);
    transform:translateX(3px);
  }

  /* ---------- 空态 ---------- */
  .empty{
    text-align:center;color:var(--muted);padding:80px 0;
    border:1px dashed var(--border);border-radius:16px;
  }

  /* ---------- Footer（与日报页一致） ---------- */
  footer{
    text-align:center;padding:40px 0 56px;color:var(--faint);font-size:12.5px;
  }
  footer .line{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--faint),transparent);margin:0 auto 14px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  footer b{color:var(--muted);font-weight:600}

  @media (max-width:560px){
    .item{padding:17px 18px}
    .item-title{font-size:15.5px}
    .arrow{width:30px;height:30px}
  }
</style>
</head>
<body>

<header>
  <div class="container head-inner">
    <div class="kicker">Tech · AI · Daily Briefing</div>
    <h1>AI 新闻简报</h1>
    <p class="sub">
      <span>每日 AI 科技新闻汇总</span>
      <span class="dot"></span>
      <span>共 <b id="count">–</b> 期</span>
    </p>
  </div>
</header>

<main>
  <div class="container">
    <div class="list" id="list"></div>
    <div class="empty" id="empty" style="display:none">暂无简报，等待第一份日报发布…</div>
  </div>
</main>

<footer class="container">
  <div class="line"></div>
  <span>由 Dim Agent 自动生成 · <a href="https://github.com/liushengxian/ai-news" target="_blank" rel="noopener">GitHub 仓库</a></span>
</footer>

<script>
  fetch('reports.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var reports = data.reports || [];
      var list = document.getElementById('list');
      document.getElementById('count').textContent = reports.length;
      if (!reports.length) {
        document.getElementById('empty').style.display = '';
        return;
      }
      var html = reports.map(function (r, i) {
        var latest = i === 0 ? '<span class="latest">最新</span>' : '';
        var meta = r.count != null ? r.count + ' 条新闻' : '已发布';
        return (
          '<a class="item" style="--i:' + (i + 1) + '" href="report.html?date=' + encodeURIComponent(r.date) + '">' +
            '<div class="item-info">' +
              '<div class="item-meta">' +
                '<span class="badge date">' + r.date + '</span>' +
                '<span class="badge count">' + meta + '</span>' +
              '</div>' +
              '<h2 class="item-title">AI 科技日报 · ' + r.date + '</h2>' +
            '</div>' +
            '<div class="item-side">' +
              latest +
              '<span class="arrow">→</span>' +
            '</div>' +
          '</a>'
        );
      }).join('');
      list.innerHTML = html;
    })
    .catch(function (err) {
      var empty = document.getElementById('empty');
      empty.style.display = '';
      empty.textContent = '加载失败：' + err.message;
    });
</script>
</body>
</html>
