<style>
  :root{
    /* Warm Editorial（Open Design） */
    --bg:#fbf6ee;
    --surface:#fffdf8;
    --surface-warm:#f1e3cf;
    --text:#201914;
    --muted:#7a6d63;
    --faint:#a89a8b;
    --border:#ded2c3;
    --border-soft:#eee4d7;
    --accent:#9b5b32;
    --accent-on:#ffffff;
    --accent2:#2f5b4f;
    --success:#4f8a4f;
    --warn:#c9822f;
    --danger:#b33a3a;
    --cat-model:#9b5b32;
    --cat-research:#2f5b4f;
    --cat-business:#4f8a4f;
    --cat-policy:#c9822f;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Segoe UI',Roboto,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    --radius-sm:10px;--radius-md:16px;--radius-lg:24px;--radius-pill:9999px;
    --elev-raised:0 20px 52px rgba(32,25,20,.10);
    --focus-ring:0 0 0 4px rgba(155,91,50,.22);
    --motion-fast:150ms;--motion-base:240ms;
    --ease-standard:cubic-bezier(.2,0,0,1);
  }
  :root[data-theme="dark"]{
    --bg:#16120e;
    --surface:#1e1914;
    --surface-warm:#2a231c;
    --text:#f2eae0;
    --muted:#a89a8b;
    --faint:#7d7165;
    --border:#3a3229;
    --border-soft:#2c261f;
    --accent:#cf8a5c;
    --accent-on:#201914;
    --accent2:#6f9d8f;
    --success:#5f9a5f;
    --warn:#d99a4a;
    --danger:#c96a5e;
    --cat-model:#cf8a5c;
    --cat-research:#6f9d8f;
    --cat-business:#6fa86f;
    --cat-policy:#d99a4a;
    --elev-raised:0 20px 52px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(155,91,50,.22)}
  .container{max-width:860px;margin:0 auto;padding:0 20px}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:color-mix(in oklab,var(--bg) 88%,transparent);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border-soft);
  }
  .head-inner{padding:22px 20px 14px}
  .kicker{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:11px;letter-spacing:.28em;color:var(--muted);
    text-transform:uppercase;font-weight:600;margin-bottom:8px;
  }
  .kicker-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .kicker .powered{
    font-size:10px;letter-spacing:.08em;color:var(--faint);opacity:.85;
    text-transform:none;font-family:var(--font-mono);
  }
  .kicker a{color:var(--muted);text-decoration:none}
  .kicker a:hover{color:var(--accent)}
  .kicker a.gh{display:inline-flex;align-items:center}
  .kicker a.gh svg{width:14px;height:14px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  footer a.gh{display:inline-flex;align-items:center;vertical-align:middle}
  footer a.gh svg{width:13px;height:13px}
  @media (max-width:560px){.kicker .powered{display:none}}
  h1{
    font-family:var(--font-display);
    font-size:clamp(32px,6vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.15;
    color:var(--text);
  }
  .sub{
    margin-top:10px;font-size:13.5px;color:var(--muted);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub .dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .sub #count{color:var(--accent);font-weight:700}
  .chips{
    margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;
    padding-bottom:2px;
  }
  .chip{
    appearance:none;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-size:12.5px;padding:6px 15px;border-radius:var(--radius-pill);
    cursor:pointer;font-family:inherit;
    transition:all var(--motion-fast) var(--ease-standard);
  }
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .chip.active{
    color:var(--accent-on);border-color:transparent;
    background:var(--accent);
    box-shadow:none;
  }

  /* ---------- Cards ---------- */
  main{padding:26px 0 8px}
  .cards{display:flex;flex-direction:column;gap:14px}
  .card{
    --cc:var(--cat-model);
    position:relative;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:20px 22px;
    transition:transform var(--motion-base) var(--ease-standard),border-color var(--motion-base) var(--ease-standard),box-shadow var(--motion-base) var(--ease-standard);
    opacity:0;transform:translateY(14px);
    animation:rise .55s cubic-bezier(.22,.8,.36,1) forwards;
    animation-delay:calc(var(--i)*38ms);
  }
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .card{opacity:1;transform:none;animation:none}
    html{scroll-behavior:auto}
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--cc);
    box-shadow:var(--elev-raised);
  }
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:500;line-height:1;
    padding:5px 10px;border-radius:var(--radius-pill);
  }
  .badge.cat{color:var(--cc);background:var(--surface-warm);border:1px solid var(--border)}
  .badge.cat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--cc)}
  .badge.src{
    color:var(--muted);background:transparent;
    border:1px solid var(--border);font-family:var(--font-mono);
    font-size:10.5px;letter-spacing:.02em;
  }
  .card-date{
    margin-left:auto;font-family:var(--font-mono);
    font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .card-title{
    font-family:var(--font-display);
    font-size:18px;font-weight:600;line-height:1.5;margin:12px 0 8px;
    letter-spacing:-.005em;
  }
  .card-title a{
    color:var(--text);text-decoration:none;
    background-image:linear-gradient(90deg,var(--cc),var(--cc));
    background-repeat:no-repeat;background-size:0% 1px;background-position:0 96%;
    transition:color var(--motion-fast) var(--ease-standard),background-size var(--motion-base) var(--ease-standard);
  }
  .card-title a:hover{color:var(--cc);background-size:100% 1px}
  .card-title .arrow{font-size:12px;color:var(--faint);margin-left:2px;opacity:0;transform:translateX(-3px);display:inline-block;transition:all var(--motion-fast) var(--ease-standard)}
  .card-title a:hover .arrow{opacity:1;transform:translateX(0);color:var(--cc)}
  .card-summary{color:var(--muted);font-size:13.8px;line-height:1.78}

  /* ---------- 空态 / 错误 ---------- */
  .empty{
    text-align:center;color:var(--muted);padding:80px 0;
    border:1px dashed var(--border);border-radius:var(--radius-md);
  }
  .empty a{color:var(--accent);text-decoration:none}
  .empty a:hover{text-decoration:underline}

  /* ---------- Footer ---------- */
  footer.container{text-align:center;padding:40px 20px 56px;color:var(--faint);font-size:12.5px}
  footer .line{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:0 auto 14px}
  footer b{color:var(--muted);font-weight:600}

  @media (max-width:560px){
    .container{padding:0 16px}
    .head-inner{padding:16px 16px 12px}
    .kicker{font-size:9.5px;letter-spacing:.16em}
    .kicker-right{gap:10px}
    h1{font-size:clamp(26px,7.5vw,34px)}
    .sub{font-size:12.5px}
    main{padding:22px 0 8px}
    .chip{font-size:11px;padding:5px 11px}
    .card{padding:17px 16px}
    .card-title{font-size:16px}
    .card-summary{font-size:13.2px}
    .card-date{margin-left:0}
    footer.container{padding:28px 16px 40px}
  }
  @media (hover:none){
    .card:hover{transform:none}
  }

  /* ---------- 主题切换 / RSS ---------- */
  .theme-btn{
    appearance:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--muted);font-size:13px;line-height:1;padding:6px 8px;cursor:pointer;
    display:inline-flex;align-items:center;
    transition:all var(--motion-fast) var(--ease-standard);
  }
  .theme-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
  .kicker a.rss{letter-spacing:.06em}

  /* ---------- 上一篇 / 下一篇 ---------- */
  .pager{display:flex;justify-content:space-between;gap:12px;margin:22px 0 6px}
  .pager-link{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);
    border:1px solid var(--border);background:var(--surface);
    border-radius:var(--radius-sm);padding:10px 16px;
    transition:all var(--motion-fast) var(--ease-standard);min-width:0;
  }
  .pager-link:hover{color:var(--accent);border-color:var(--accent)}
  .pager-link .nav-arr{font-size:16px;color:var(--faint);flex-shrink:0}
  .pager-link:hover .nav-arr{color:var(--accent)}
  .pager-link .pp{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pager-link small{font-size:10.5px;color:var(--faint);letter-spacing:.08em}
  .pager-link b{font-size:12.5px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  .pager-link.next{margin-left:auto;flex-direction:row-reverse}
  .pager-link.ph{opacity:.32;pointer-events:none}
</style>
</head>

<script>
  var CATS = {
    model:    { label: '模型发布', cc: 'var(--cat-model)' },
    research: { label: '前沿研究', cc: 'var(--cat-research)' },
    business: { label: '融资动态', cc: 'var(--cat-business)' },
    policy:   { label: '政策监管', cc: 'var(--cat-policy)' }
  };
  var state = { filter: 'all' };
  var reports = [];

  function qs(name) {
    return new URLSearchParams(location.search).get(name);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function render(data) {
    var date = data.date || qs('date');
    var news = data.news || [];
    document.getElementById('count').textContent = news.length;
    var p = String(date || '').split('-');
    document.getElementById('sub-date').textContent =
      p[0] && p[1] && p[2] ? p[0] + ' 年 ' + p[1] + ' 月 ' + p[2] + ' 日' : '—';
    document.getElementById('footer-date').textContent = date || '—';
    document.title = 'AI 科技日报 · ' + (date || '');

    var html = news.map(function (n, i) {
      var cat = CATS[n.category] || CATS.model;
      var dateText = n.date ? '<span class="card-date">' + esc(n.date) + '</span>' : '';
      var src = n.source ? '<span class="badge src">' + esc(n.source) + '</span>' : '';
      return (
        '<article class="card" data-cat="' + esc(n.category || 'model') + '" style="--i:' + (i + 1) + ';--cc:' + cat.cc + '">' +
          '<div class="card-meta">' +
            '<span class="badge cat">' + cat.label + '</span>' +
            src +
            dateText +
          '</div>' +
          '<h2 class="card-title"><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.title) + '<span class="arrow">↗</span></a></h2>' +
          '<p class="card-summary">' + esc(n.summary) + '</p>' +
        '</article>'
      );
    }).join('');

    document.getElementById('cards').innerHTML = html;
    document.getElementById('empty').style.display = 'none';
    applyFilter();
  }

  function applyFilter() {
    var f = state.filter, n = 0;
    document.querySelectorAll('.card').forEach(function (card) {
      var show = (f === 'all' || card.dataset.cat === f);
      card.style.display = show ? '' : 'none';
      if (show) n++;
    });
    document.getElementById('count').textContent = n;
  }

  // 分类筛选
  document.getElementById('chips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    applyFilter();
  });

  // ---------- 上一篇 / 下一篇 ----------
  var pager = document.getElementById('pager');
  var prevLink = document.getElementById('prev');
  var nextLink = document.getElementById('next');

  function renderNav(date) {
    var i = -1;
    reports.forEach(function (r, idx) { if (r.date === date) i = idx; });
    if (i < 0) { pager.style.display = 'none'; return; }
    pager.style.display = 'flex';
    var prev = reports[i + 1], next = reports[i - 1];
    if (prev) {
      prevLink.href = 'report.html?date=' + encodeURIComponent(prev.date);
      prevLink.querySelector('b').textContent = prev.date;
      prevLink.classList.remove('ph');
    } else { prevLink.classList.add('ph'); }
    if (next) {
      nextLink.href = 'report.html?date=' + encodeURIComponent(next.date);
      nextLink.querySelector('b').textContent = next.date;
      nextLink.classList.remove('ph');
    } else { nextLink.classList.add('ph'); }
  }

  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft' && !prevLink.classList.contains('ph') && prevLink.href) {
      location.href = prevLink.href;
    }
    if (e.key === 'ArrowRight' && !nextLink.classList.contains('ph') && nextLink.href) {
      location.href = nextLink.href;
    }
  });

  // ---------- 加载数据 ----------
  var empty = document.getElementById('empty');
  empty.textContent = '加载中…';

  var load = function (d) {
    var url = 'data/' + d + '.json';
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      render(data);
      if (reports.length) renderNav(d);
    });
  };

  fetch('reports.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (m) {
      reports = m.reports || [];
      var requested = qs('date');
      var target = requested || (reports[0] && reports[0].date);
      if (!target) throw new Error('no reports');
      if (!requested) history.replaceState(null, '', '?date=' + target);
      renderNav(target);
      return load(target);
    })
    .catch(function (err) {
      if (qs('date')) {
        load(qs('date')).catch(function () {
          empty.style.display = '';
          empty.textContent = '未找到 ' + qs('date') + ' 的数据';
        });
      } else {
        empty.style.display = '';
        empty.textContent = '暂无数据';
      }
    });

  // ---------- 主题切换 ----------
  (function () {
    var btn = document.getElementById('themeBtn');
    function cur() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
    function sync() {
      var ico = btn && btn.querySelector('.ico');
      if (ico) ico.textContent = cur() === 'light' ? '🌙' : '☀️';
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', cur() === 'light' ? '#fbf6ee' : '#16120e');
    }
    if (btn) btn.addEventListener('click', function () {
      var t = cur() === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('theme', t); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
</body>
</html>
